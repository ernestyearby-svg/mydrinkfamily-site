<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">Dynasty Works Studio primary identity</title>
  <desc id="desc">A gold dimensional aperture emblem and elegant Dynasty Works Studio wordmark on an obsidian field.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d6429"/><stop offset=".28" stop-color="#f5da8d"/><stop offset=".55" stop-color="#c79943"/><stop offset=".8" stop-color="#ffedac"/><stop offset="1" stop-color="#8b6328"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="42%" r="80%"><stop stop-color="#171818"/><stop offset="1" stop-color="#060706"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".6"/></filter>
  </defs>
  <rect width="1800" height="720" fill="url(#field)"/>
  <g transform="translate(105 72)" fill="none" stroke="url(#gold)" filter="url(#shadow)">
    <circle cx="288" cy="288" r="255" stroke-width="4"/><circle cx="288" cy="288" r="224" stroke-width="1.5" opacity=".7"/>
    <!-- Dimensional studio aperture -->
    <path d="M288 127 430 209v164L288 455 146 373V209Z" stroke-width="10"/>
    <path d="M288 127v328M146 209l284 164M430 209 146 373" stroke-width="4" opacity=".8"/>
    <path d="M288 190 375 240v100l-87 50-87-50V240Z" stroke-width="8"/>
    <!-- DWS monogram, reduced geometric construction -->
    <path d="M247 250v81h26c43 0 43-81 0-81Z" stroke-width="9" stroke-linejoin="round"/>
    <path d="m298 250 14 81 17-53 17 53 14-81" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M393 259c-10-12-31-13-39-1-15 23 45 17 34 52-6 19-34 22-48 5" stroke-width="9" stroke-linecap="round"/>
    <path d="M164 491h248" stroke-width="3"/><path d="M220 518h136" stroke-width="2" opacity=".7"/>
  </g>
  <g fill="url(#gold)">
    <text x="720" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="112" letter-spacing="12">DYNASTY WORKS</text>
    <text x="720" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="112" letter-spacing="23">STUDIO</text>
    <rect x="725" y="451" width="900" height="2" opacity=".75"/>
    <text x="729" y="512" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="9">CREATIVE PRODUCTION &amp; IP MANAGEMENT</text>
  </g>
</svg>
